name: Build wheels with maturin
description: Install maturin (and patchelf/ziglang/cargo-zigbuild on Linux) at a fixed deterministic path so sccache hits across --zig runs, then run maturin.

inputs:
  command:
    description: Maturin subcommand (`build`, `sdist`, `publish`, or `setup` to only install tools onto PATH).
    required: false
    default: build
  args:
    description: Extra arguments passed to maturin.
    required: false
    default: ''
  manylinux:
    description: Linux manylinux tag (e.g. `2_31`); passed as `--manylinux` on Linux builds and ignored elsewhere.
    required: false
    default: ''
  target:
    description: Optional Rust target triple; installed via rustup if missing and passed as `--target`.
    required: false
    default: ''
  zig:
    description: Set to `true` to install `ziglang` and `cargo-zigbuild` on Linux (also auto-enabled when `--zig` is in `args`).
    required: false
    default: ''
  working-directory:
    description: Directory to run maturin in.
    required: false
    default: .

runs:
  using: composite
  steps:
    - id: check-uv
      shell: bash
      run: |
        if command -v uv >/dev/null 2>&1; then
          echo "installed=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: AnswerDotAI/.github/actions/setup-uv@main
      if: steps.check-uv.outputs.installed != 'true'

    - name: Install tools and run maturin
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_MANYLINUX: ${{ inputs.manylinux }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_ZIG: ${{ inputs.zig }}
        INPUT_WORKDIR: ${{ inputs.working-directory }}
      run: |
        py=""
        for p in python3 python; do
          if "$p" -c "import sys" >/dev/null 2>&1; then py="$p"; break; fi
        done
        [ -n "$py" ] || { echo "No working Python interpreter found" >&2; exit 1; }
        "$py" - <<'PY'
        import os, re, shlex, subprocess, sys
        from pathlib import Path

        cmd = os.environ.get("INPUT_COMMAND", "").strip() or "build"
        args = shlex.split(os.environ.get("INPUT_ARGS", ""))
        manylinux = os.environ.get("INPUT_MANYLINUX", "").strip()
        target = os.environ.get("INPUT_TARGET", "").strip()
        zig_in = os.environ.get("INPUT_ZIG", "").strip().lower()
        workdir = os.environ.get("INPUT_WORKDIR", "").strip() or "."

        is_linux = sys.platform.startswith("linux")
        is_win = sys.platform == "win32"
        ext = ".exe" if is_win else ""

        # Fixed deterministic path keeps cargo-zigbuild's exe_hash constant so sccache hits across runs.
        tool_dir = Path(os.environ.get("RUNNER_TEMP", r"C:\aai-maturin")) / "aai-maturin" if is_win else Path("/tmp/aai-maturin")
        tools_dir, bin_dir = tool_dir / "tools", tool_dir / "bin"
        maturin_bin = bin_dir / f"maturin{ext}"

        need_patchelf = is_linux and cmd != "sdist"
        want_zig = is_linux and (zig_in == "true" or "--zig" in args)
        have_all = (
            maturin_bin.exists()
            and (not need_patchelf or (bin_dir / "patchelf").exists())
            and (not want_zig or ((bin_dir / "cargo-zigbuild").exists() and (bin_dir / "zig").exists()))
        )

        if not have_all:
            install_cmd = ["uv", "tool", "install", "--force", "maturin"]
            with_execs = []
            if need_patchelf:
                install_cmd += ["--with", "patchelf"]
                with_execs.append("patchelf")
            if want_zig:
                install_cmd += ["--with", "ziglang", "--with", "cargo-zigbuild"]
                with_execs.append("cargo-zigbuild")
            if with_execs:
                install_cmd += ["--with-executables-from", ",".join(with_execs)]
            install_env = os.environ | {"UV_TOOL_DIR": str(tools_dir), "UV_TOOL_BIN_DIR": str(bin_dir)}
            subprocess.run(install_cmd, env=install_env, check=True)
            if want_zig:
                venv_py = tools_dir / "maturin" / "bin" / "python"
                zig_path = subprocess.check_output(
                    [str(venv_py), "-c", "import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent / 'zig')"],
                    text=True,
                ).strip()
                zig_link = bin_dir / "zig"
                if zig_link.exists() or zig_link.is_symlink(): zig_link.unlink()
                zig_link.symlink_to(zig_path)

        gh_path = os.environ.get("GITHUB_PATH")
        if gh_path:
            with open(gh_path, "a", encoding="utf-8") as f: f.write(f"{bin_dir}\n")

        run_env = os.environ.copy()
        run_env["PATH"] = f"{bin_dir}{os.pathsep}{run_env.get('PATH', '')}"
        run_env.setdefault("CARGO_INCREMENTAL", "0")
        run_env.setdefault("CARGO_TERM_COLOR", "always")

        subprocess.run([str(maturin_bin), "--version"], env=run_env, check=True)
        if want_zig:
            subprocess.run([str(bin_dir / "cargo-zigbuild"), "--version"], env=run_env, check=True)
            subprocess.run([str(bin_dir / "zig"), "version"], env=run_env, check=True)

        if cmd == "setup": sys.exit(0)

        if cmd in ("build", "publish"):
            if not is_linux and "--zig" in args:
                args = [a for a in args if a != "--zig"]

            arg_target = next((args[i + 1] for i, a in enumerate(args[:-1]) if a == "--target"), "")
            if not arg_target:
                arg_target = next((a.split("=", 1)[1] for a in args if a.startswith("--target=")), "")
            eff_target = target or arg_target
            if eff_target:
                libdir = subprocess.check_output(["rustc", "--print", "target-libdir", "--target", eff_target], env=run_env, text=True).strip()
                if not Path(libdir).is_dir():
                    subprocess.run(["rustup", "target", "add", eff_target], env=run_env, check=True)
                if not arg_target:
                    args = ["--target", eff_target, *args]

            if is_linux and manylinux:
                ml = re.sub(r"^manylinux_?", "", manylinux)
                has_ml = any(a in ("--manylinux", "--compatibility") or a.startswith(("--manylinux=", "--compatibility=")) for a in args)
                if ml and ml != "auto" and not has_ml:
                    args = ["--manylinux", ml, *args]

        subprocess.run([str(maturin_bin), cmd, *args], cwd=workdir, env=run_env, check=True)
        PY
