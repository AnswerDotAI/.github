name: Setup sccache with R2
description: Install sccache and configure it against a Cloudflare R2 URL; skips when r2-url is empty.

inputs:
  r2-url:
    description: Cloudflare R2 URL (https://[key:secret@]<acct>.r2.cloudflarestorage.com/<bucket>[/prefix][?rw_mode=READ_ONLY]). Empty skips setup.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: mozilla-actions/sccache-action@v0.0.11
      if: ${{ inputs.r2-url != '' }}

    - name: Configure and start sccache
      if: ${{ inputs.r2-url != '' }}
      shell: bash
      env:
        R2_URL: ${{ inputs.r2-url }}
      run: |
        py=""
        for p in python3 python; do
          if "$p" -c "import sys" >/dev/null 2>&1; then py="$p"; break; fi
        done
        [ -n "$py" ] || { echo "No working Python interpreter found" >&2; exit 1; }
        "$py" - <<'PY'
        import json, os, subprocess, sys
        from pathlib import Path
        from urllib.parse import parse_qs, unquote, urlsplit

        u = urlsplit(os.environ["R2_URL"].strip())
        parts = [p for p in u.path.strip("/").split("/") if p]
        if u.scheme not in ("http", "https") or not u.hostname or not parts:
            raise SystemExit("Invalid r2-url: expected https://[key:secret@]<endpoint>/<bucket>[/prefix]")
        if (u.username is None) != (u.password is None):
            raise SystemExit("Invalid r2-url: specify both access key and secret key, or neither")

        endpoint = f"{u.scheme}://{u.hostname}" + (f":{u.port}" if u.port else "")
        ak = unquote(u.username) if u.username is not None else None
        sk = unquote(u.password) if u.password is not None else None
        rw_mode = parse_qs(u.query).get("rw_mode", [None])[0]

        s3 = dict(bucket=parts[0], endpoint=endpoint, region="auto", use_ssl=(u.scheme == "https"), no_credentials=(ak is None))
        if len(parts) > 1: s3["key_prefix"] = "/".join(parts[1:])
        if rw_mode: s3["rw_mode"] = rw_mode
        elif ak is None: s3["rw_mode"] = "READ_ONLY"

        def tv(v): return ("true" if v else "false") if isinstance(v, bool) else json.dumps(v)
        tmp = Path(os.environ.get("RUNNER_TEMP", "/tmp"))
        cfg, err_log = tmp / "sccache.toml", tmp / "sccache.log"
        ws = os.environ.get("GITHUB_WORKSPACE")
        header = f"basedirs = [{json.dumps(ws)}]\n\n" if ws else ""
        cfg.write_text(header + "[cache.s3]\n" + "\n".join(f"{k} = {tv(v)}" for k, v in s3.items()) + "\n")

        env = {k: v for k, v in os.environ.items() if k not in ("R2_URL", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "AWS_SESSION_TOKEN", "AWS_PROFILE")}
        env.update(SCCACHE_CONF=str(cfg), SCCACHE_IDLE_TIMEOUT="0", SCCACHE_SKIP_CACHE_CHECK="1", SCCACHE_ERROR_LOG=str(err_log))
        if ak is not None: env.update(AWS_ACCESS_KEY_ID=ak, AWS_SECRET_ACCESS_KEY=sk)
        subprocess.run(["sccache", "--stop-server"], env=env, capture_output=True)
        err_log.unlink(missing_ok=True)
        r = subprocess.run(["sccache", "--start-server"], env=env)
        if r.returncode:
            if err_log.exists() and (log := err_log.read_text(errors="replace")): print(log, file=sys.stderr)
            raise SystemExit(r.returncode)
        PY
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
